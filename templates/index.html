<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatLamport - Sistema Distribuido</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link rel="stylesheet" href="../static/css/estilos.css" />
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>

<div id="loginOverlay" class="login-overlay">
  <div class="login-card">
    <h2>💬 ChatLamport</h2>
    <input type="text" id="username" placeholder="Usuario" autocomplete="off" />
    <input type="password" id="password" placeholder="Contraseña" />
    <button id="btnLogin">Iniciar Sesión</button>
    <div class="toggle-mode" id="toggleMode">
      ¿No tienes cuenta? Regístrate
    </div>
    <div id="errorMsg" class="error-msg"></div>
  </div>
</div>

<div class="app">
  <aside class="sidebar" id="sidebar" style="display: none;">
    <div class="sidebar-header">
      <div class="sidebar-user">
        <div class="avatar avatar-purple avatar-lg" id="userAvatar">U</div>
        <span class="sidebar-user-name" id="currentUser">Usuario</span>
      </div>
      <i class="ti ti-logout sidebar-icon" id="btnLogout" aria-hidden="true"></i>
    </div>

    <div class="search-bar">
      <div class="search-inner">
        <i class="ti ti-search search-icon" aria-hidden="true"></i>
        <span class="search-placeholder">Buscar contacto</span>
      </div>
    </div>

    <div id="usersList">
      <!-- Lista de usuarios se llena dinámicamente -->
    </div>
  </aside>

  <main class="chat-main" id="chatMain" style="display: none;">
    <div class="chat-header">
      <div class="avatar avatar-blue" id="chatAvatar">?</div>
      <div class="chat-header-info">
        <div class="chat-header-name" id="chatWith">Selecciona un chat</div>
        <div class="chat-header-status" id="chatStatus">Selecciona un usuario</div>
      </div>
      <div class="chat-header-actions">
        <i class="ti ti-search" aria-hidden="true"></i>
        <i class="ti ti-phone" aria-hidden="true"></i>
        <i class="ti ti-dots-vertical" aria-hidden="true"></i>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="date-separator">
        <span>Hoy</span>
      </div>
    </div>

    <div class="chat-input-area">
      <i class="ti ti-paperclip input-icon" id="paperclipBtn" aria-hidden="true"></i>
      <input type="file" id="fileInput" style="display:none;" />
      <input class="input-field" id="messageInput" type="text" placeholder="Escribe un mensaje..." disabled />
      <button class="send-btn" id="sendBtn" aria-label="Enviar mensaje" disabled>
        <i class="ti ti-send" aria-hidden="true"></i>
      </button>
    </div>
  </main>
</div>

<script src="../static/js/chat.js"></script>
</body>
</html>
